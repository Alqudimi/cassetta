name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:core
      - run: pnpm test:transport
      - run: pnpm test:cli
      - run: pnpm build:cli
      - run: pnpm --dir packages/cli pack --pack-destination /tmp/cassetta-pack
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/cassetta-pack/*.tgz
          generate_release_notes: true
