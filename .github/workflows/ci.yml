name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:core
      - run: pnpm test:transport
      - run: pnpm bench:core
      - run: pnpm test:cli
      - run: pnpm build
      - run: pnpm --dir packages/cli pack --pack-destination /tmp/cassetta-pack
      - run: test -f /tmp/cassetta-pack/cassetta-cli-0.8.0.tgz
      - run: pnpm audit --audit-level high
